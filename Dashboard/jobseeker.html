<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobseeker Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <div class="container">
            <h1><i class="fas fa-user"></i> Jobseeker Dashboard</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="employer.html">Employer Dashboard</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Jobseeker Dashboard Content -->
    <section class="dashboard-section">
        <div class="container">
            <h2>Welcome, Jobseeker</h2>
            <div class="dashboard">
                <div class="card">
                    <h3><i class="fas fa-search"></i> Search Jobs</h3>
                    <p>Find jobs that match your skills and interests.</p>
                    <button class="btn">Search Jobs</button>
                </div>
                <div class="card">
                    <h3><i class="fas fa-user-edit"></i> Manage Profile</h3>
                    <p>Update your resume and profile information.</p>
                    <button class="btn">Update Profile</button>
                </div>
                <div class="card">
                    <h3><i class="fas fa-file-signature"></i> Track Applications</h3>
                    <p>Monitor the status of your job applications.</p>
                    <button class="btn">Track Applications</button>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
